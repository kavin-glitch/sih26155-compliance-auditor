# EdgeCore-OS style configuration (unsupported vendor - no built-in parser)
/system identity set name=EDGE-UNKNOWN-01
/ip service disable telnet
/ip service enable ssh
/ip service set www disabled=yes
/ip service set www-ssl disabled=no
/system logging action add target=remote address=10.0.0.20
/system clock ntp-client set enabled=yes primary-ntp=10.0.0.1
/user aaa-profile set radius-enabled=yes
/ip firewall filter add chain=input src-address=10.0.0.0/24 action=accept comment="mgmt-access"
/snmp community set [find default=yes] name=public
/user settings set login-retry-limit=3
/system console set idle-timeout=10m
