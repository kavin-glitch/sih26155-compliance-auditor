# EdgeCore-OS style configuration - second device, same vendor
/system identity set name=EDGE-UNKNOWN-02
/ip service disable telnet
/ip service enable ssh
/ip service set www disabled=yes
/ip service set www-ssl disabled=no
/system logging action add target=remote address=10.0.1.20
/system clock ntp-client set enabled=yes primary-ntp=10.0.1.1
/user aaa-profile set radius-enabled=yes
/ip firewall filter add chain=input src-address=10.0.1.0/24 action=accept comment="mgmt-access"
/snmp community set [find default=yes] name=CorpSecure2026
/user settings set login-retry-limit=5
/system console set idle-timeout=8m
