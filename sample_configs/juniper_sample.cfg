# Juniper SRX sample configuration
set system host-name CORE-FW-01
set system services ssh protocol-version v2
set system services web-management https
delete system services web-management http
set system login user admin authentication encrypted-password "$6$abcxyz"
set system login password minimum-length 6
set system login message "Authorized access only."
set system login idle-timeout 15
set system syslog host 10.0.0.20 any any
set system ntp server 10.0.0.1
set firewall filter PROTECT-RE term allow-mgmt from source-address 10.0.0.0/24
set firewall filter PROTECT-RE term allow-mgmt then accept
set snmp community public authorization read-only
set system login retry-options tries-before-disconnect 3
