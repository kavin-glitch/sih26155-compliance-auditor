!
hostname EDGE-RTR-01
!
enable secret 5 $1$abcd$xyz
service password-encryption
!
no ip http server
!
banner motd ^C Authorized access only. Unauthorized use is prohibited. ^C
!
aaa new-model
!
ip ssh version 1
!
snmp-server community public RO
!
line con 0
 exec-timeout 5 0
line vty 0 4
 transport input telnet ssh
 exec-timeout 30 0
!
ntp server 10.0.0.1
!
end
